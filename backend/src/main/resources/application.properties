# ==================== ????? ====================
# ???????
server.port=8088
hnblue.external-data.root=${HNBLUE_EXTERNAL_DATA_ROOT:data/raw}
hnblue.load-test-login.enabled=${HNBLUE_LOAD_TEST_LOGIN_ENABLED:false}
# Compress bandwidth-heavy JSON/text responses. The public ECS has a limited
# egress link, and the V2 region/literature pages are tens of kilobytes each.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/problem+json,text/html,text/plain,text/css,application/javascript
# ??Tomcat????
server.tomcat.accesslog.enabled=true
# ????????
server.tomcat.accesslog.directory=logs
# ????????
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b

# ==================== Redis???? ====================
# Redis??????????
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:3000ms}

# ==================== ????? ====================
# JPA Hibernate DDL??????
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# MySQL?????URL
# spring.datasource.url=jdbc:mysql://localhost:3306/hnblue?allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hnblue?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
# ??????
spring.datasource.username=${DB_USERNAME:hnblue}
# ?????
spring.datasource.password=${DB_PASSWORD:}
# ???????
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ==================== ?????? ====================
# SMTP???????
spring.mail.host=${MAIL_HOST:smtp.example.com}
# SMTP????????SSL???
spring.mail.port=${MAIL_PORT:465}
# ???????
spring.mail.username=${MAIL_USERNAME:}
# ????????
spring.mail.password=${MAIL_PASSWORD:}
# SMTP????
spring.mail.properties.mail.smtp.auth=true
# ??TLS?????
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# ??SSL?????
spring.mail.properties.mail.smtp.ssl.enable=true

# ==================== ?????? ====================
# ????????
spring.servlet.multipart.max-file-size=10MB
# ????????
spring.servlet.multipart.max-request-size=10MB

# ==================== API???? ====================
# ??API????
base.api.url=/api/
# ????API??
chat.api.path=/api/chat

# ==================== MVC?? ====================
# ???????????
spring.mvc.throw-exception-if-no-handler-found=true
# ????????
spring.web.resources.add-mappings=false

# ==================== ???API?? ====================
# DeepSeek??API??
api.password=${DEEPSEEK_API_KEY:}
# Base64-encoded 32-byte key used only to encrypt administrator-managed secrets at rest.
security.secret.master-key=${HNBLUE_SECRET_ENCRYPTION_KEY:}
deepseek.enabled=${DEEPSEEK_ENABLED:true}
deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
# Disabled by default because it bypasses HNBLUE retrieval, evidence gates and citation validation.
deepseek.legacy-direct.enabled=${DEEPSEEK_LEGACY_DIRECT_ENABLED:false}
# HNBLUE-owned local hybrid retrieval service. No external RAG platform is required.
rag.local.enabled=${HNBLUE_LOCAL_RAG_ENABLED:true}
rag.api.url=${RAG_API_URL:http://127.0.0.1:8880}

# ==================== ?????? ====================
# Spring????????
logging.level.org.springframework.cache=${CACHE_LOG_LEVEL:INFO}
# MQTT?????????
logging.level.org.eclipse.paho.client.mqttv3=${MQTT_LOG_LEVEL:INFO}
# Spring????????
logging.level.org.springframework.integration=${INTEGRATION_LOG_LEVEL:INFO}

# Browser origins allowed to call the API. Use a comma-separated allowlist.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8090}

# Model proxy upstream
model.api.url=${MODEL_API_URL:http://127.0.0.1:8880}
