server.port=8088
hnblue.external-data.root=${HNBLUE_EXTERNAL_DATA_ROOT:data/raw}
hnblue.load-test-login.enabled=${HNBLUE_LOAD_TEST_LOGIN_ENABLED:false}
# Compress bandwidth-heavy JSON/text responses. The public ECS has a limited
# egress link, and the V2 region/literature pages are tens of kilobytes each.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/problem+json,text/html,text/plain,text/css,application/javascript
# ??Tomcat????
server.tomcat.accesslog.enabled=true
# ????????
server.tomcat.accesslog.directory=logs
# ????????
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b

# ==================== Redis???? ====================
# Redis??????????
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:3000ms}
# HNBLUE uses RedisTemplate/Streams, not Spring Data Redis repositories.
spring.data.redis.repositories.enabled=false

# ==================== ????? ====================
# JPA Hibernate DDL??????
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Migration execution is opt-in for local/legacy environments. The production
# profile enables it together with Hibernate validation after schema baselining.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
# MySQL?????URL
# spring.datasource.url=jdbc:mysql://localhost:3306/hnblue?allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hnblue?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
# ??????
spring.datasource.username=${DB_USERNAME:hnblue}
# ?????
spring.datasource.password=${DB_PASSWORD:}
# ???????
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ==================== ?????? ====================
# SMTP???????
spring.mail.host=${MAIL_HOST:smtp.example.com}
# SMTP????????SSL???
spring.mail.port=${MAIL_PORT:465}
# ???????
spring.mail.username=${MAIL_USERNAME:}
# ????????
spring.mail.password=${MAIL_PASSWORD:}
# SMTP????
spring.mail.properties.mail.smtp.auth=true
# ??TLS?????
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# ??SSL?????
spring.mail.properties.mail.smtp.ssl.enable=true

# ==================== ?????? ====================
# ????????
spring.servlet.multipart.max-file-size=10MB
# ????????
spring.servlet.multipart.max-request-size=10MB

# ==================== API???? ====================
# ??API????
base.api.url=/api/
# ????API??
chat.api.path=/api/chat

# ==================== MVC?? ====================
# ???????????
spring.mvc.throw-exception-if-no-handler-found=true
# ????????
spring.web.resources.add-mappings=false

# ==================== ???API?? ====================
# DeepSeek??API??
api.password=${DEEPSEEK_API_KEY:}
# Base64-encoded 32-byte key used only to encrypt administrator-managed secrets at rest.
security.secret.master-key=${HNBLUE_SECRET_ENCRYPTION_KEY:}
deepseek.enabled=${DEEPSEEK_ENABLED:false}
deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
# Disabled by default because it bypasses HNBLUE retrieval, evidence gates and citation validation.
deepseek.legacy-direct.enabled=${DEEPSEEK_LEGACY_DIRECT_ENABLED:false}
# HNBLUE-owned local hybrid retrieval service. No external RAG platform is required.
rag.local.enabled=${HNBLUE_LOCAL_RAG_ENABLED:true}
rag.api.url=${RAG_API_URL:http://127.0.0.1:8880}

# ==================== ?????? ====================
# Spring????????
logging.level.org.springframework.cache=${CACHE_LOG_LEVEL:INFO}
# MQTT?????????
logging.level.org.eclipse.paho.client.mqttv3=${MQTT_LOG_LEVEL:INFO}
# Spring????????
logging.level.org.springframework.integration=${INTEGRATION_LOG_LEVEL:INFO}

# Browser origins allowed to call the API. Use a comma-separated allowlist.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8090}
hnblue.jwt.require-configured=${HNBLUE_JWT_REQUIRE_CONFIGURED:false}

# Model proxy upstream
model.api.url=${MODEL_API_URL:http://127.0.0.1:8880}

# Data identity is explicit and independent from row-level is_simulated flags.
# AUTHORIZED_OFFICIAL only denotes the approved school research path; it does
# not imply that every material was covered by a government review.
hnblue.data.mode=${HNBLUE_DATA_MODE:SYNTHETIC_TEST}
hnblue.data.dataset-identity=${HNBLUE_DATASET_IDENTITY:HNBLUE_JAVA_V2_CURRENT_DATABASE}
hnblue.data.review-status=${HNBLUE_DATA_REVIEW_STATUS:not-reviewed}
hnblue.data.access-status=${HNBLUE_DATA_ACCESS_STATUS:test-only}
hnblue.data.government-reviewed=${HNBLUE_DATA_GOVERNMENT_REVIEWED:false}

# ==================== Agent governance ====================
spring.jpa.open-in-view=false
hnblue.agent.gateway.enabled=${HNBLUE_AGENT_GATEWAY_ENABLED:false}
hnblue.agent.gateway.url=${HNBLUE_AGENT_GATEWAY_URL:http://127.0.0.1:8890}
# Local models can have a materially slower cold start than warm inference.
# Keep the transport deadline below the maximum business task deadline while
# avoiding false gateway failures during an otherwise healthy cold start.
hnblue.agent.gateway.timeout=${HNBLUE_AGENT_GATEWAY_TIMEOUT:120s}
hnblue.agent.gateway.internal-token=${HNBLUE_AGENT_INTERNAL_TOKEN:}
hnblue.agent.executor.core-size=${HNBLUE_AGENT_EXECUTOR_CORE_SIZE:2}
hnblue.agent.executor.max-size=${HNBLUE_AGENT_EXECUTOR_MAX_SIZE:4}
hnblue.agent.executor.queue-capacity=${HNBLUE_AGENT_EXECUTOR_QUEUE_CAPACITY:50}
hnblue.agent.timeout-scan-ms=${HNBLUE_AGENT_TIMEOUT_SCAN_MS:60000}
hnblue.agent.dispatch.mode=${HNBLUE_AGENT_DISPATCH_MODE:local}
hnblue.agent.redis.stream=${HNBLUE_AGENT_REDIS_STREAM:hnblue:agent:tasks}
hnblue.agent.redis.group=${HNBLUE_AGENT_REDIS_GROUP:hnblue-agent-workers}
hnblue.agent.redis.consumer=${HNBLUE_AGENT_REDIS_CONSUMER:${HOSTNAME:local}-worker}
hnblue.agent.redis.publish-ms=${HNBLUE_AGENT_REDIS_PUBLISH_MS:250}
hnblue.agent.redis.consume-ms=${HNBLUE_AGENT_REDIS_CONSUME_MS:250}
hnblue.agent.redis.retry-after=${HNBLUE_AGENT_REDIS_RETRY_AFTER:60s}
hnblue.agent.redis.max-attempts=${HNBLUE_AGENT_REDIS_MAX_ATTEMPTS:3}

resilience4j.circuitbreaker.instances.agentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.agentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.agentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.agentService.wait-duration-in-open-state=30s
resilience4j.bulkhead.instances.agentService.max-concurrent-calls=4
resilience4j.bulkhead.instances.agentService.max-wait-duration=0
resilience4j.retry.instances.agentService.max-attempts=2
resilience4j.retry.instances.agentService.wait-duration=200ms
resilience4j.retry.instances.agentService.retry-exceptions=java.io.IOException

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
# SMTP is optional in this distribution. Without configured credentials its
# health probe must not make the otherwise healthy API report DOWN.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
