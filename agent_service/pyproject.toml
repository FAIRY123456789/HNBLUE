[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hnblue-agent-service"
version = "0.1.0"
description = "HNBLUE controlled blue-carbon LangGraph agent harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
    "jsonschema>=4.25,<5",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
addopts = "-q"
